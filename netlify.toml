[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# the F9 cheat menu is for testing: it's left out of the production deploy of main, and kept in deploy previews and
# branch deploys (tools/build.mjs)
[context.production.environment]
  CHEATS = "off"

# index.html asks for game.js, game.css and three.js by content hash (?v=...), so a new deploy is picked up straight
# away (three.js too: the build carries only the parts of it the game uses, so it changes when they do)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# recorded sounds are asked for by a hash of their contents (?v=...), so they can be kept a long time
[[headers]]
  for = "/sounds/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
